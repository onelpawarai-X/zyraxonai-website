name: Patch Builder runtime guard

on:
  push:
    branches:
      - fix/builder-files-runtime-normalization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize Builder files state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/BuilderStudioV4.tsx')
          s = p.read_text()
          old = "const recognition=useRef<any>(null); const active=files.find(f=>f.path===activeFile)||files[0]; const html=files.find(f=>f.path.toLowerCase()==='index.html')?.content||active.content;"
          new = "const recognition=useRef<any>(null); const safeFiles:BuilderFile[]=Array.isArray(files)?files:(files&&typeof files==='object'&&Array.isArray((files as any).files)?(files as any).files:[]); const active=safeFiles.find(f=>f.path===activeFile)||safeFiles[0]||{path:'index.html',content:'<!doctype html><html><body></body></html>'}; const html=safeFiles.find(f=>f.path.toLowerCase()==='index.html')?.content||active.content;"
          if old not in s:
              raise SystemExit('Expected BuilderStudioV4 state line was not found; aborting without changes.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove temporary patch workflow
        run: rm -f .github/workflows/patch-builder-files-runtime.yml
      - name: Commit runtime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BuilderStudioV4.tsx .github/workflows/patch-builder-files-runtime.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(builder): guard non-array files state'
          git push
