name: Provider and speech checks

# The build gate only proves the bundle compiles. These are the checks that prove
# the provider, its integrations, the speech-to-text decode path and the
# text-to-speech voice selection still behave — the parts that regressed silently
# before. ffmpeg and espeak-ng are installed so the audio decode assertions run
# against real containers instead of being skipped.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Provider, integration, speech and SEO checks
        run: npm run test:provider
