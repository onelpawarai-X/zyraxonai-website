name: tmp-freeprobe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-freeprobe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the free tier from a fresh runner IP
        run: |
          node -e '
          const T=(n)=>({type:"function",function:{name:n,description:n,parameters:{type:"object",properties:{},required:[]}}});
          const hex=(n)=>Array.from({length:n},()=>"0123456789abcdef"[Math.floor(Math.random()*16)]).join("");
          const b62=(n)=>{const C="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";return Array.from({length:n},()=>C[Math.floor(Math.random()*62)]).join("");};
          const UP="https://opencode.ai/inference/v1/chat/completions";
          const GW="https://zyraxon-egress.nla85695.workers.dev/";
          (async()=>{
            console.log("runner IP:", await fetch("https://api.ipify.org").then(r=>r.text()).catch(()=>"?"));
            for (const [label,url,extra] of [["direct",UP,{}],["via-cf",GW,{"x-zyraxon-target":UP}]]){
              let ok=0;
              for(let i=0;i<4;i++){
                const s="ses_"+hex(12)+b62(14);
                const h={"content-type":"application/json","user-agent":"opencode/1.19.4","x-opencode-session":s,"x-opencode-session-id":s,...extra};
                const body=JSON.stringify({model:"beam-free",max_tokens:24,messages:[{role:"user",content:"Reply with exactly PONG"}],stream:true,tools:[T("read")]});
                let st=0,out="";
                try{
                  const r=await fetch(url,{method:"POST",headers:h,body});
                  st=r.status; const txt=await r.text();
                  if(txt.includes("PONG")) {out="PONG"; ok++;}
                  else if(txt.includes("FreeUsageLimitError")) out="429";
                  else if(txt.includes("FreeTierError")) out="403";
                  else if(txt.startsWith("data:")) {out="stream"; ok++;}
                  else out=txt.slice(0,40);
                }catch(e){ st=-1; out=e.message.slice(0,40); }
                console.log(`${label.padEnd(9)} #${i+1} http=${st} ${out}`);
              }
              console.log(`${label}: ${ok}/4 good`);
            }
          })();
          '
