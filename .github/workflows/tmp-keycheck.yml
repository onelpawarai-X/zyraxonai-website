name: tmp-keycheck

on:
  workflow_dispatch:
    inputs:
      key:
        description: key to test (masked in logs)
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the upstream from a fresh IP, with and without the key
        env:
          ZKEY: ${{ github.event.inputs.key }}
        run: |
          echo "::add-mask::$ZKEY"
          node -e '
          const T=(n)=>({type:"function",function:{name:n,description:n,parameters:{type:"object",properties:{},required:[]}}});
          const hex=(n)=>Array.from({length:n},()=>"0123456789abcdef"[Math.floor(Math.random()*16)]).join("");
          const b62=(n)=>{const C="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";return Array.from({length:n},()=>C[Math.floor(Math.random()*62)]).join("");};
          const KEY=process.env.ZKEY;
          const ips=["https://opencode.ai/inference/v1/chat/completions","https://opencode.ai/zen/v1/chat/completions"];
          (async()=>{
            console.log("runner IP:", await fetch("https://api.ipify.org").then(r=>r.text()).catch(()=>"?"));
            for (const base of ips){
              for (const [label, auth] of [["with key",`Bearer ${KEY}`],["no key",null]]){
                const s="ses_"+hex(12)+b62(14);
                const h={"content-type":"application/json","user-agent":"opencode/1.19.4","x-opencode-session":s,"x-opencode-session-id":s};
                if(auth) h.Authorization=auth;
                const body=JSON.stringify({model:"beam-free",max_tokens:32,messages:[{role:"user",content:"Reply with exactly PONG"}],stream:true,tools:[T("read")]});
                let st=0,out="";
                try{
                  const r=await fetch(base,{method:"POST",headers:h,body});
                  st=r.status; const txt=await r.text();
                  if(txt.includes("PONG")) out="PONG";
                  else if(txt.startsWith("data:")) out="stream";
                  else { try{ out=JSON.parse(txt).error?.type; }catch{ out=txt.slice(0,30); } }
                }catch(e){ st=-1; out=e.message.slice(0,30); }
                console.log(`${String(st).padEnd(5)} ${String(out).padEnd(24)} ${label.padEnd(10)} ${base.includes("zen")?"/zen":"/inference"}`);
              }
            }
          })();
          '
