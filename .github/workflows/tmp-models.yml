name: tmp-models

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-models.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask every free model from a fresh IP
        run: |
          node -e '
          const T=(n)=>({type:"function",function:{name:n,description:n,parameters:{type:"object",properties:{filePath:{type:"string"}},required:[]}}});
          const hex=(n)=>Array.from({length:n},()=>"0123456789abcdef"[Math.floor(Math.random()*16)]).join("");
          const b62=(n)=>{const C="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";return Array.from({length:n},()=>C[Math.floor(Math.random()*62)]).join("");};
          const ids=["big-pickle","beam-free","flint-40b-free","mimo-v2.6-flash-free","nemotron-3.5-super-vl-free","nemotron-3.5-lightning-free","deepseek-v4.1-flash-free","glm-5.3-flash-free"];
          (async()=>{
            const ip=await fetch("https://api.ipify.org").then(r=>r.text()).catch(()=>"?");
            console.log("runner IP:", ip);
            for (const m of ids){
              const s="ses_"+hex(12)+b62(14);
              const body=JSON.stringify({model:m,max_tokens:64,messages:[{role:"user",content:"Reply with exactly PONG"}],stream:true,tools:[T("read")]});
              let st=0, out="";
              try{
                const r=await fetch("https://opencode.ai/inference/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","user-agent":"opencode/1.19.4","x-opencode-session":s,"x-opencode-session-id":s},body});
                st=r.status;
                const txt=await r.text();
                if(txt.startsWith("data:")){
                  const mm=txt.match(/"content":"([^"]*)"/g);
                  out=mm?mm.join("").replace(/"content":"|"/g,"").slice(0,30):"(empty)";
                } else { try{ out=JSON.parse(txt).error?.type||"?"; }catch{ out=txt.slice(0,30); } }
              }catch(e){ st=-1; out=e.message.slice(0,25); }
              console.log(`${String(st).padEnd(5)} ${JSON.stringify(out).padEnd(34)} ${m}`);
              await new Promise(r=>setTimeout(r,800));
            }
          })();
          '
