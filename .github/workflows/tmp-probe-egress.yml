name: tmp-probe-egress

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-probe-egress.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe upstream from this runner's IP
        run: |
          node -e '
          const T=(n)=>({type:"function",function:{name:n,description:n,parameters:{type:"object",properties:{filePath:{type:"string"}},required:[]}}});
          const hex=(n)=>Array.from({length:n},()=>"0123456789abcdef"[Math.floor(Math.random()*16)]).join("");
          const b62=(n)=>{const C="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";return Array.from({length:n},()=>C[Math.floor(Math.random()*62)]).join("");};
          (async()=>{
            const ip=await fetch("https://api.ipify.org").then(r=>r.text()).catch(()=>"?");
            console.log("runner IP:", ip);
            for (let i=0;i<3;i++){
              const s="ses_"+hex(12)+b62(14);
              const body=JSON.stringify({model:"beam-free",max_tokens:32,messages:[{role:"user",content:"Say PONG"}],stream:true,tools:[T("read")]});
              try{
                const r=await fetch("https://opencode.ai/inference/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","user-agent":"opencode/1.19.4","x-opencode-session":s,"x-opencode-session-id":s},body});
                const txt=await r.text();
                console.log("try"+i, r.status, txt.startsWith("data:")?"STREAM-OK":txt.slice(0,140));
              }catch(e){ console.log("try"+i, "ERR", e.message); }
              await new Promise(r=>setTimeout(r,2000));
            }
          })();
          '
